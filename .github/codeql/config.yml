# Acota QUE se analiza, antes de creerle a la primera cifra.
#
# Aca vivia una exclusion de test/investigacion, que eran scripts de
# exploracion de un rato y HTML capturado del sitio de la CMF guardado
# como evidencia. Generaban 65 de las 74 alertas y su volumen tapaba las
# 3 de severidad alta que SI estaban en codigo del Worker.
#
# El 29 de agosto de 2026 esa carpeta se borro entera, que es la unica
# salida honesta cuando algo "no se despliega y no se va a arreglar". Con
# la carpeta fuera, la exclusion sobra y el analisis vuelve a cubrir todo
# lo que queda. Excluir es esconder; borrar es no tener que esconder.
#
# Lo que sigue excluido es lo que se genera o se descarga, y por eso no
# es codigo nuestro que revisar.
#
# test/exclusiones-vivas.test.ts vigila esta lista. una exclusion que
# apunta a una carpeta que ya no existe deja la puerta abierta para que
# alguien cree otra con ese nombre y nadie la revise.
name: "CodeQL para el codigo que se despliega"

paths-ignore:
  - dist
  - node_modules

# security-and-quality trae ademas las reglas de calidad, y valen la
# pena. Encontraron 6 declaraciones sin usar que ni el linter local ni el
# detector de codigo muerto veian, que es justo el punto de tener capas
# con agujeros en lugares distintos.
queries:
  - uses: security-and-quality
